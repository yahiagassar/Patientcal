<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عيادة صحتي - الإيرادات والمصروفات</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/parse/3.2.0/parse.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* {
box-sizing: border-box;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
background: linear-gradient(135deg, #e0f7fa, #f5f5f5);
margin: 0;
padding: 20px;
min-height: 100vh;
}

.container {
max-width: 900px;
margin: 0 auto;
background: white;
border-radius: 15px;
box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
overflow: hidden;
padding: 25px;
}

header {
background: linear-gradient(to right, #1a237e, #283593);
color: white;
padding: 20px;
border-radius: 12px 12px 0 0;
text-align: center;
margin: -25px -25px 25px -25px;
position: relative;
}

h1 {
margin: 0;
font-size: 28px;
font-weight: 600;
}

.supplier-badge {
position: absolute;
top: 15px;
left: 15px;
background: #ff9800;
padding: 8px 15px;
border-radius: 30px;
font-weight: bold;
font-size: 16px;
}

.form-container {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
gap: 20px;
margin-bottom: 25px;
}

.form-section {
background: #f8fdff;
border-radius: 10px;
padding: 20px;
border: 1px solid #e0f2f1;
box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
}

.form-section h2 {
margin-top: 0;
color: #1a237e;
border-bottom: 2px solid #1a237e;
padding-bottom: 10px;
font-size: 20px;
display: flex;
align-items: center;
gap: 10px;
}

.form-section h2 i {
font-size: 24px;
}

.input-group {
margin-bottom: 15px;
}

label {
display: block;
margin-bottom: 8px;
font-weight: 600;
color: #37474f;
}

input, select {
width: 100%;
padding: 12px;
border: 1px solid #b2ebf2;
border-radius: 8px;
font-size: 16px;
background: #f8fdff;
transition: all 0.3s;
}

input:focus, select:focus {
outline: none;
border-color: #1a237e;
box-shadow: 0 0 0 3px rgba(26, 35, 126, 0.1);
}

.expenses-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
gap: 12px;
margin-top: 15px;
}

.expense-input {
padding: 10px;
border: 1px solid #e0f7fa;
border-radius: 8px;
background: #f8fdff;
text-align: center;
}

.expense-input label {
font-size: 14px;
margin-bottom: 5px;
color: #546e7a;
}

.expense-input input {
text-align: center;
padding: 8px;
}

.result-box {
background: #e8f5e9;
border: 1px solid #c8e6c9;
border-radius: 8px;
padding: 15px;
margin-top: 20px;
text-align: center;
font-weight: bold;
color: #2e7d32;
font-size: 18px;
}

.result-box span {
font-size: 24px;
display: block;
margin-top: 5px;
color: #1b5e20;
}

.buttons {
display: flex;
gap: 15px;
margin-top: 25px;
}

button {
flex: 1;
padding: 14px;
border: none;
border-radius: 8px;
font-size: 16px;
font-weight: 600;
cursor: pointer;
transition: all 0.3s;
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
}

#saveButton {
background: linear-gradient(to right, #2e7d32, #4caf50);
color: white;
}

#saveButton:hover {
background: linear-gradient(to right, #1b5e20, #388e3c);
transform: translateY(-2px);
box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
}

#resetButton {
background: linear-gradient(to right, #b71c1c, #f44336);
color: white;
}

#resetButton:hover {
background: linear-gradient(to right, #c62828, #e53935);
transform: translateY(-2px);
box-shadow: 0 4px 12px rgba(183, 28, 28, 0.3);
}

.status-message {
margin-top: 20px;
padding: 15px;
border-radius: 8px;
text-align: center;
font-weight: 600;
display: none;
}

.success {
background: #e8f5e9;
color: #2e7d32;
border: 1px solid #c8e6c9;
}

.error {
background: #ffebee;
color: #c62828;
border: 1px solid #ffcdd2;
}

.loading {
display: inline-block;
width: 20px;
height: 20px;
border: 3px solid rgba(255,255,255,.3);
border-radius: 50%;
border-top-color: #fff;
animation: spin 1s ease-in-out infinite;
vertical-align: middle;
}

@keyframes spin {
to { transform: rotate(360deg); }
}

.logo {
text-align: center;
margin-bottom: 20px;
}

.logo span {
font-size: 24px;
font-weight: bold;
color: #1a237e;
display: inline-block;
padding: 10px 20px;
background: #e3f2fd;
border-radius: 50px;
}

.supplier-section {
background: #e3f2fd;
padding: 15px;
border-radius: 10px;
margin-bottom: 20px;
border: 1px solid #bbdefb;
}

.supplier-section h3 {
margin-top: 0;
color: #0d47a1;
display: flex;
align-items: center;
gap: 10px;
}

.supplier-info {
display: flex;
gap: 15px;
align-items: center;
margin-top: 10px;
}

.supplier-avatar {
width: 60px;
height: 60px;
border-radius: 50%;
background: #bbdefb;
display: flex;
align-items: center;
justify-content: center;
font-size: 24px;
color: #0d47a1;
}

.supplier-details {
flex: 1;
}

.customer-section {
background: #f3e5f5;
padding: 15px;
border-radius: 10px;
margin-bottom: 20px;
border: 1px solid #e1bee7;
}

.customer-section h3 {
margin-top: 0;
color: #4a148c;
display: flex;
align-items: center;
gap: 10px;
}

.income-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 15px;
margin-top: 15px;
}

.income-input {
padding: 10px;
border: 1px solid #e0f7fa;
border-radius: 8px;
background: #f8fdff;
}

.income-input label {
font-size: 14px;
margin-bottom: 5px;
color: #546e7a;
}

.income-input input {
padding: 8px;
}

@media (max-width: 600px) {
.form-container {
grid-template-columns: 1fr;
}

.buttons {
flex-direction: column;
}

.supplier-info {
flex-direction: column;
text-align: center;
}

.income-grid {
grid-template-columns: 1fr;
}
}
</style>
</head>
<body>
<div class="container">
<div class="logo">
<span><i class="fas fa-clinic-medical"></i> عيادة صحتي</span>
</div>

<header>
<div class="supplier-badge">تطبيق الموردين</div>
<h1>نظام تسجيل الإيرادات والمصروفات</h1>
</header>

<div class="supplier-section">
<h3><i class="fas fa-user-tie"></i> معلومات المورد</h3>
<div class="supplier-info">
<div class="supplier-avatar">
<i class="fas fa-user"></i>
</div>
<div class="supplier-details">
<p>اختر اسم المورد المسؤول عن إدخال البيانات</p>
</div>
</div>

<div class="input-group">
<label for="supplierName">اسم المورد:</label>
<select id="supplierName">
<option value="محمد">محمد</option>
<option value="وائل">وائل</option>
</select>
</div>
</div>

<div class="customer-section">
<h3><i class="fas fa-user-injured"></i> معلومات المشتروات</h3>
<div class="input-group">
<label for="customerName">اسم المشتروات:</label>
<input type="text" id="customerName" placeholder="أدخل اسم المشتروات">
</div>
<p style="margin-top: 10px; color: #666; font-size: 14px;">
<i class="fas fa-info-circle"></i> يرجى إدخال اسم المشتروات
</p>
</div>

<div class="form-container">
<div class="form-section">
<h2><i class="fas fa-calendar-day"></i> بيانات اليوم</h2>

<div class="input-group">
<label for="date">اليوم:</label>
<input type="text" id="date" placeholder="أدخل اليوم (مثال: الاثنين)">
</div>

<div class="input-group">
<label for="datePicker">التاريخ:</label>
<input type="date" id="datePicker">
</div>

<div class="input-group">
<label for="dailyIncome">إيرادات اليوم:</label>
<input type="number" id="dailyIncome" placeholder="المبلغ بالريال اليمني">
</div>

<!-- تمت إضافة مربعات الإدخال الجديدة هنا -->
<div class="income-grid">
<div class="income-input">
<label for="inspectionPapers">أوراق المعاينة:</label>
<input type="number" id="inspectionPapers" placeholder="المبلغ بالريال اليمني">
</div>

<div class="income-input">
<label for="dentalXRay">أشعة الأسنان:</label>
<input type="number" id="dentalXRay" placeholder="المبلغ بالريال اليمني">
</div>
</div>
</div>

<div class="form-section">
<h2><i class="fas fa-receipt"></i> المصروفات</h2>

<div class="expenses-grid">
<div class="expense-input">
<label for="expenses1">المشتروات</label>
<input type="number" id="expenses1" placeholder="0">
</div>

<div class="expense-input">
<label for="expenses2">يحي</label>
<input type="number" id="expenses2" placeholder="0">
</div>

<div class="expense-input">
<label for="expenses3">أمين</label>
<input type="number" id="expenses3" placeholder="0">
</div>

<div class="expense-input">
<label for="expenses4">معمل</label>
<input type="number" id="expenses4" placeholder="0">
</div>

<div class="expense-input">
<label for="expenses5">موظف</label>
<input type="number" id="expenses5" placeholder="0">
</div>

<div class="expense-input">
<label for="expenses6">ناديه</label>
<input type="number" id="expenses6" placeholder="0">
</div>

<div class="expense-input">
<label for="expenses7">الممرضة</label>
<input type="number" id="expenses7" placeholder="0">
</div>

<div class="expense-input">
<label for="expenses8">محمد</label>
<input type="number" id="expenses8" placeholder="0">
</div>
</div>

<div class="result-box">
المبلغ المورد: <span id="netIncome">0.00</span> ر.ي
</div>
</div>
</div>

<div class="buttons">
<button id="saveButton">
<i class="fas fa-save"></i> حفظ البيانات
</button>
<button id="resetButton">
<i class="fas fa-redo"></i> إعادة تعيين
</button>
</div>

<div id="statusMessage" class="status-message"></div>
</div>

<script>
// تهيئة Parse SDK مع back4app
Parse.initialize(
"6u75tawtDec0p0Cu1T7ILZ7uIO5TPshO2h480H75", // App ID
"tOVke3m9mC3jauOW1TigdMWhmqZ7FKofb929g1Yq"  // JavaScript Key
);
Parse.serverURL = 'https://parseapi.back4app.com/';

document.addEventListener('DOMContentLoaded', () => {
// تعيين التاريخ الحالي كقيمة افتراضية
const today = new Date();
const formattedDate = today.toISOString().split('T')[0];
document.getElementById('datePicker').value = formattedDate;

// إضافة الأسماء العربية للأيام
const days = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const dayName = days[today.getDay()];
document.getElementById('date').value = dayName;

// إضافة مستمعات الأحداث لحقول الإدخال
document.getElementById('dailyIncome').addEventListener('input', calculateNetIncome);
document.getElementById('inspectionPapers').addEventListener('input', calculateNetIncome);
document.getElementById('dentalXRay').addEventListener('input', calculateNetIncome);

const expenseInputs = document.querySelectorAll('input[id^="expenses"]');
expenseInputs.forEach(input => {
input.addEventListener('input', calculateNetIncome);
});

// مستمع حدث لحفظ البيانات
document.getElementById('saveButton').addEventListener('click', saveDataToBack4app);

// مستمع حدث لإعادة التعيين
document.getElementById('resetButton').addEventListener('click', resetFields);
});

// وظيفة حساب صافي الدخل
function calculateNetIncome() {
const dailyIncome = parseFloat(document.getElementById('dailyIncome').value) || 0;
const inspectionPapers = parseFloat(document.getElementById('inspectionPapers').value) || 0;
const dentalXRay = parseFloat(document.getElementById('dentalXRay').value) || 0;

let totalExpenses = 0;
const expenseInputs = document.querySelectorAll('input[id^="expenses"]');

expenseInputs.forEach(input => {
totalExpenses += parseFloat(input.value) || 0;
});

// حساب إجمالي الإيرادات (بما في ذلك الإيرادات الجديدة)
const totalIncome = dailyIncome + inspectionPapers + dentalXRay;

const netIncome = totalIncome - totalExpenses;
document.getElementById('netIncome').textContent = netIncome.toFixed(2);
}

// وظيفة حفظ البيانات إلى back4app
async function saveDataToBack4app() {
// جمع البيانات من النموذج
const supplierName = document.getElementById('supplierName').value;
const customerName = document.getElementById('customerName').value;
const date = document.getElementById('date').value;
const datePicker = document.getElementById('datePicker').value;
const dailyIncome = parseFloat(document.getElementById('dailyIncome').value) || 0;
const inspectionPapers = parseFloat(document.getElementById('inspectionPapers').value) || 0;
const dentalXRay = parseFloat(document.getElementById('dentalXRay').value) || 0;
const netIncome = parseFloat(document.getElementById('netIncome').textContent) || 0;

// جمع بيانات المصروفات
const expenses = [];
for (let i = 1; i <= 8; i++) {
const name = document.querySelector(`label[for="expenses${i}"]`).textContent;
const amount = parseFloat(document.getElementById(`expenses${i}`).value) || 0;

if (amount > 0) {
expenses.push({
name: name,
amount: amount
});
}
}

// التحقق من البيانات الأساسية
if (!customerName || !date || datePicker  <= 0) {
showStatus('يرجى ملء جميع الحقول الأساسية بشكل صحيح', 'error');
return;
}

// إعداد الزر لعرض حالة التحميل
const saveButton = document.getElementById('saveButton');
const originalText = saveButton.innerHTML;
saveButton.innerHTML = '<span class="loading"></span> جاري الحفظ...';
saveButton.disabled = true;

try {
// إنشاء كائن Parse
const FinancialData = Parse.Object.extend("FinancialData");
const financialRecord = new FinancialData();

// تعيين قيم السجل مع إضافة اسم المورد واسم المشتري
financialRecord.set("supplierName", supplierName);
financialRecord.set("customerName", customerName);
financialRecord.set("date", date);
financialRecord.set("datePicker", datePicker);
financialRecord.set("dailyIncome", dailyIncome);
financialRecord.set("inspectionPapers", inspectionPapers);
financialRecord.set("dentalXRay", dentalXRay);
financialRecord.set("netIncome", netIncome);
financialRecord.set("expenses", expenses);

// حفظ السجل
await financialRecord.save();

// عرض رسالة النجاح مع اسم المورد والمشتري
showStatus(`تم حفظ البيانات بنجاح باسم المورد: ${supplierName} والمشتروات: ${customerName}`, 'success');

// إعادة تعيين الحقول
resetFields();

} catch (error) {
console.error('حدث خطأ أثناء الحفظ:', error);
showStatus(`خطأ في الحفظ: ${error.message}`, 'error');
} finally {
// إعادة الزر إلى حالته الأصلية
saveButton.innerHTML = originalText;
saveButton.disabled = false;
}
}

// وظيفة إعادة تعيين الحقول
function resetFields() {
document.getElementById('customerName').value = '';
document.getElementById('dailyIncome').value = '';
document.getElementById('inspectionPapers').value = '';
document.getElementById('dentalXRay').value = '';
document.getElementById('netIncome').textContent = '0.00';

for (let i = 1; i <= 8; i++) {
document.getElementById(`expenses${i}`).value = '';
}
}

// وظيفة عرض حالة العملية
function showStatus(message, type) {
const statusElement = document.getElementById('statusMessage');
statusElement.textContent = message;
statusElement.className = `status-message ${type}`;
statusElement.style.display = 'block';

// إخفاء الرسالة بعد 5 ثواني
setTimeout(() => {
statusElement.style.display = 'none';
}, 5000);
}
</script>
</body>
</html>
